name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax and shellcheck
        run: |
          for f in scripts/*.sh .githooks/*; do bash -n "$f"; done
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck scripts/*.sh .githooks/*
      - name: settings.json is valid JSON
        run: jq . .claude/settings.json >/dev/null
      - name: Relative Markdown links resolve
        run: scripts/check-links.sh
      - name: Charter version matches the changelog
        run: scripts/check-version.sh
      - name: The push gate behaves as the charter says
        run: scripts/check-gate.sh
