name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and shellcheck
        run: |
          bash -n scripts/*.sh
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck scripts/*.sh
      - name: settings.json is valid JSON
        run: jq . .claude/settings.json >/dev/null
      - name: Relative Markdown links resolve
        run: scripts/check-links.sh
      - name: Charter version matches the changelog
        run: scripts/check-version.sh
