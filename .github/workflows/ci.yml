name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax and shellcheck
        run: |
          for f in scripts/*.sh .githooks/* install.sh; do bash -n "$f"; done
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck scripts/*.sh .githooks/* install.sh
      - name: Relative links, images and anchors resolve
        run: scripts/check-links.sh
      - name: The link check catches broken links, images and anchors
        run: scripts/check-link-checker.sh
      - name: Charter version matches the changelog
        run: scripts/check-version.sh
      - name: The pre-push gate behaves as the charter says
        run: scripts/check-gate.sh
      - name: The merge gate stops when a PR is behind main on a file it changes
        run: scripts/check-merge-gate.sh
      - name: The compaction hooks keep their snapshots in the main checkout
        run: scripts/check-handoff.sh
      - name: The installer installs, upgrades and refuses as it says
        run: scripts/check-install.sh
      - name: install.sh installs the chosen tag with that tag's own installer
        run: scripts/check-one-line-install.sh
      - name: No squad script filters gh by label
        run: scripts/check-gh-filters.sh
